<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Lattes – Nilson Clementino Ferreira</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#101319">
<meta name="description" content="Painel interativo do currículo Lattes de Nilson Clementino Ferreira (UFG): produção, orientações, bancas, projetos, trajetória e mapa.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4e89'/%3E%3Cpath d='M8 22V10m5 12V14m5 8V8m5 14v-6' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light;
  --bg:#f4f6f9; --surface:#fff; --ink:#141a24; --ink2:#444c5b; --muted:#667085; --line:#dde2ea; --line2:#eceff4;
  --accent:#1d4e89; --accent-ink:#fff; --accent-soft:#e6eef9; --focus:#2a78d6;
  --g1:#2a78d6; --g2:#eb6834; --g3:#1baf7a; --g4:#eda100; --g5:#e87ba4; --g6:#008300; --g7:#6250d6; --g8:#e34948; --gr:#8a919e;
  --seq0:#cde2fb; --seq1:#9ec5f4; --seq2:#5598e7; --seq3:#256abf; --seq4:#104281;
  --shadow:0 1px 2px rgba(20,26,36,.06),0 6px 20px -8px rgba(20,26,36,.14);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101319; --surface:#181c24; --ink:#eceef3; --muted:#9aa3b2; --ink2:#c3c8d2; --line:#2a303b; --line2:#222833;
  --accent:#7fb0ee; --accent-ink:#0c1522; --accent-soft:#1c2a40; --focus:#7fb0ee;
  --g1:#3987e5; --g2:#d95926; --g3:#199e70; --g4:#c98500; --g5:#d55181; --g6:#008300; --g7:#9085e9; --g8:#e66767; --gr:#7d8696;
  --seq0:#184f95; --seq1:#1c5cab; --seq2:#256abf; --seq3:#3987e5; --seq4:#86b6ef;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -10px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.2}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:var(--accent-ink);padding:8px 12px;border-radius:6px;z-index:100}
.skip:focus{left:8px}
[hidden]{display:none!important}
.muted{color:var(--muted)}

/* top */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--accent)}
.brand span{display:flex;flex-direction:column;line-height:1.2;color:var(--ink)}
.brand b{font-family:var(--serif);font-size:17px;font-weight:600}
.brand small{color:var(--muted);font-size:12.5px}
.tabs{display:flex;gap:2px;margin-left:auto;overflow:auto}
.tabs button{background:none;border:0;padding:9px 14px;border-radius:8px;color:var(--ink2);font-weight:500;white-space:nowrap}
.tabs button:hover{background:var(--line2)}
.tabs button[aria-selected=true]{background:var(--accent);color:var(--accent-ink)}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:9px;font-size:20px;line-height:1;flex:none}
.icon-btn:hover{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border:1px solid var(--line);background:var(--surface);border-radius:9px;text-decoration:none;color:var(--ink);font-weight:500;font-size:14px}
.btn:hover{border-color:var(--accent)}
.view{max-width:1280px;margin:0 auto;padding:0 20px 56px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:36px;align-items:start;padding:36px 0 22px}
.hero h1{font-size:clamp(28px,3.6vw,42px);margin-bottom:12px}
.hero .sub{color:var(--ink2);margin:0 0 14px;font-size:16px}
.hero .bio{color:var(--ink2);font-size:14.5px;max-width:68ch;margin:0}
.id-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:10px}
.id-card h2{font-size:15px;font-family:var(--sans);font-weight:600;color:var(--ink2)}
.id-row{display:grid;grid-template-columns:110px 1fr;gap:10px;font-size:14px;align-items:baseline}
.id-row span{color:var(--muted)}
.cite-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cite{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.cite b{display:block;font:600 24px var(--serif);font-variant-numeric:tabular-nums}
.cite span{font-size:12.5px;color:var(--muted)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:6px 0 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.kpis div{padding:14px 16px;border-right:1px solid var(--line);min-width:0}
.kpis div:last-child{border-right:0}
.kpis dt{color:var(--muted);font-size:13px}
.kpis dd{margin:2px 0 0;font:600 28px var(--serif);font-variant-numeric:tabular-nums}
.kpis dd small{display:block;font:400 12px var(--sans);color:var(--muted)}

/* page heads / sections */
.page-head{padding:30px 0 14px}
.page-head h1{font-size:clamp(26px,3vw,36px);margin-bottom:8px}
.page-head p{margin:0 0 6px;color:var(--ink2);max-width:75ch}
.sec{padding:26px 0;border-top:1px solid var(--line)}
.sec>header{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.sec h2{font-size:21px}
.sec .take{margin:0 0 14px;color:var(--ink2);max-width:80ch}
.sec .note{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:34px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px}
.chart-area{position:relative;min-width:0}
.chart-area svg{display:block;width:100%;height:auto;overflow:visible}
.axis text{fill:var(--muted);font-size:12px}
.axis line,.axis path{stroke:var(--line)}
.gridline{stroke:var(--line2)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0 0 10px;font-size:13px;color:var(--ink2);list-style:none;padding:0}
.legend li{display:flex;align-items:center;cursor:default}
.legend i,.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.tblbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:13px;color:var(--ink2)}
.tblbtn:hover{border-color:var(--accent)}
.bar-row{cursor:default}
.bar-label{fill:var(--ink2);font-size:12.5px}
.bar-val{fill:var(--ink);font-size:12.5px;font-variant-numeric:tabular-nums}
.chart-area .hit{fill:transparent}

/* toolbar + table */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;padding:12px 0}
.search{position:relative;flex:1 1 260px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;height:38px;padding:0 12px 0 38px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.search input::placeholder{color:var(--muted)}
.sel{height:38px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:6px;font-size:14px;color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:13px;color:var(--ink2);display:inline-flex;gap:6px;align-items:center}
button.chip[aria-pressed=true]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent);font-weight:600}
.chip .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.tscroll{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.dtable{width:100%;border-collapse:collapse;font-size:13.5px}
.dtable th,.dtable td{padding:8px 10px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}
.dtable thead th{font-weight:600;color:var(--ink2);position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);white-space:nowrap}
.dtable th button{background:none;border:0;padding:0;font-weight:600;color:inherit;display:inline-flex;gap:4px;align-items:center}
.dtable th button:hover{color:var(--accent)}
.dtable td.num,.dtable th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dtable tbody tr:hover{background:color-mix(in srgb,var(--accent-soft) 60%,transparent)}
.dtable td .sub{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.dtable .tag{display:inline-block;font-size:11.5px;border:1px solid var(--line);border-radius:99px;padding:0 8px;color:var(--ink2);white-space:nowrap}
.pager{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:10px;font-size:13.5px;color:var(--muted);flex-wrap:wrap}
.pager .btns{display:flex;gap:6px;align-items:center}
.pager button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px}
.pager button:disabled{opacity:.45;cursor:default}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pcard h3{font:600 15.5px/1.35 var(--sans);letter-spacing:0}
.pcard .when{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pcard p{margin:0;color:var(--ink2);font-size:13.5px}
.pcard details summary{cursor:pointer;color:var(--accent);font-size:13px}
.badge{font-size:11.5px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--ink2)}
.badge.on{border-color:color-mix(in srgb,var(--g3) 60%,transparent);color:var(--g3)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.list li{display:grid;grid-template-columns:64px 1fr;gap:12px;font-size:14px;align-items:baseline}
.list time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.deg{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.deg .pcard b{font:600 12px var(--sans);color:var(--accent);letter-spacing:.02em}

/* timeline */
.tl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:auto;padding:8px 4px}
#timeline{display:block;min-width:900px;width:100%}
.tl-lane-label{fill:var(--ink2);font-size:12.5px}
.tl-grid{stroke:var(--line);stroke-width:1}
.tl-axis text{fill:var(--muted);font-size:12px}
.tl-bar{cursor:default}
.tl-bar:hover{filter:brightness(1.12)}

/* map */
.map-shell{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.map-box{position:relative;height:min(68vh,640px);min-height:420px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#aab3bf;touch-action:none;cursor:grab}
.map-box.drag{cursor:grabbing}
.map-tiles,.map-over{position:absolute;inset:0}
.map-tiles img{position:absolute;width:256px;height:256px;user-select:none;-webkit-user-drag:none;pointer-events:none}
.map-over{pointer-events:none}
.map-over svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.map-over circle,.map-over path{pointer-events:auto;cursor:pointer}
.map-over circle:hover{stroke:var(--ink);stroke-width:2.5}
.map-ctl{position:absolute;left:10px;top:10px;display:grid;gap:6px;z-index:3}
.map-ctl button{width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:18px;line-height:1;box-shadow:var(--shadow)}
.map-attr{position:absolute;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 85%,transparent);font-size:11px;padding:2px 7px;border-top-left-radius:8px;color:var(--ink2);z-index:3}
.map-attr a{color:inherit}
.map-pop{position:absolute;z-index:5;width:min(320px,88%);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;font-size:13.5px;cursor:default}
.map-pop h3{font:600 15px var(--sans);margin-bottom:2px;padding-right:22px}
.map-pop button.x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:18px;color:var(--muted)}
.map-pop ul{margin:8px 0 0;padding:0 0 0 16px;max-height:190px;overflow:auto}
.map-pop li{margin:0 0 4px}
.map-note{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-size:12.5px;color:var(--ink2);z-index:4;box-shadow:var(--shadow);text-align:center;max-width:90%}
.map-side{display:grid;gap:14px}
.map-side .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.map-side h3{font:600 14px var(--sans);margin-bottom:8px}
.layer{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;padding:5px 0;font-size:14px;cursor:pointer}
.layer input{accent-color:var(--accent)}
.layer .n{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.range{display:grid;gap:4px;font-size:13px;color:var(--ink2)}
.range input[type=range]{width:100%;accent-color:var(--accent)}
.plist{max-height:300px;overflow:auto;display:grid;gap:2px}
.plist button{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;text-align:left;padding:5px 6px;border:0;background:none;border-radius:6px;font-size:13.5px}
.plist button:hover{background:var(--line2)}
.plist .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px}

/* tooltip */
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);padding:8px 11px;font-size:13px;max-width:320px}
.tip b{display:block;margin-bottom:2px}
.tip .r{display:flex;justify-content:space-between;gap:16px;font-variant-numeric:tabular-nums}
.foot{max-width:1280px;margin:0 auto;padding:22px 20px 40px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}

@media(max-width:980px){
  .hero{grid-template-columns:1fr}
  .two,.three{grid-template-columns:1fr}
  .map-shell{grid-template-columns:1fr}
  .brand small{display:none}
  .top-in{gap:10px;flex-wrap:wrap}
  .tabs{order:3;width:100%;margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.badge{white-space:nowrap}

</style>
<script>var t='dark';try{t=localStorage.getItem('lattes-theme')||'dark'}catch(e){}document.documentElement.dataset.theme=t;</script>

bioma é sua relação geográfica com as nascentes e parte considerável das três maiores bacias da América do Sul (i.e. Paraguai ? Paraná, Araguaia- Tocantins e São Francisco), A sua sazonalidade pluviométrica tem grande relação com a cobertura vegetal nativa, suas limitações hídricas e edáficas (Motta et al., 2002). Devido suas características físicas e sua enorme biodiversidade, o Cerrado é considerado um dos hotspots de biodiversidade no mundo (Myers et al., 2000), tanto por seus aspectos naturais, quanto pela intensa ocupação agropastoril que o transformou na principal fronteira de expansão agrícola brasileira (Klink & Machado, 2005; Miziara & Ferreira, 2007). Estimativas quanto à ocupação e conversão do bioma Cerrado variam da ordem de 40% (Mantovani & Pereira, 1998; Mittermayer et al., 1999; Sano et al., 2002), 47% (Eva et al., 2004) a 55% (Machado et al., 2004). Uma iniciativa de monitoramento da vegetação nativa do bioma Cerrado que merece destaque é o Sistema Integrado de Alerta de Desmatamentos (SIAD) (Ferreira et al., 2007a), desenvolvido pelo Laboratório de Processamento de Imagens e Geoprocessamento da Universidade Federal de Goiás (LAPIG/UFG). Para o período de 2003 a 2006, através do SIAD foram detectados 22.580 km2 de áreas com alteração na cobertura vegetal nativa que podem indicar ocorrência de novos desmatamentos, concentrados principalmente nos Estados do Mato Grosso, Bahia, Piauí, Maranhão e Tocantins. Atualmente, existem duas regiões aonde a vegetação nativa vem sendo mais intensamente alterada, ou seja, no estado do Mato Grosso e no oeste da Bahia, aonde vem se desenvolvendo principalmente a monocultura para exportação. É importante observar também, que na porção centro-sul do bioma Cerrado, praticamente não ocorreu alteração da cobertura vegetal nativa, no entanto naquela região já não existem áreas com reman.","situacao":"Em andamento","natureza":"Pesquisa","alunos":"Graduação: (2) / Mestrado acadêmico: (4)","integrantes":"Nilson Clementino Ferreira - Coordenador / Marcos Vinícius Alexandre da Silva - Integrante / AQUILA SILVA LEVINDO - Integrante / CASSIO HENRIQUE GIUSTI CEZARE - Integrante / GETULIO GRACELLI JUNIOR - Integrante / WALLESKA ALVES DE AQUINO FERREIRA - Integrante / ROGERIO ALVES BERNARDO - Integrante","fin":"Conselho Nacional de Desenvolvimento Científico e Tecnológico - Bolsa","tipo":"Pesquisa"},{"ini":2010,"fim":2013,"titulo":"Avaliação da Qualidade Ambiental da Bacia Hidrográfica e do Reservatório do Ribeirão João Leite","desc":"A barragem do Ribeirão João Leite é considerada como uma das maiores obras de saneamento no Brasil, e vai assegurar o abastecimento de água tratada para Goiânia e seu entorno até o ano de 2040, com previsão de atender 3 milhões de pessoas. O lago formado pela barragem possui área superior a 18 km2, ocupando áreas dos municípios de Goiânia, Goianápolis, Nerópolis e Terezópolis de Goiás. A barragem do ribeirão João Leite, garantirá recurso hídrico para a sustentabilidade social e econômica em uma das regiões mais populosas do estado de Goiás e do bioma Cerrado. No entanto, a manutenção ou melhoria da qualidade ambiental do reservatório e da bacia hidrográfica do ribeirão João Leite é o pressuposto mais importante para a garantia da qualidade e quantidade d?água oriunda do reservatório. O objehvo desta pesquisa é avaliar a qualidade e riscos ambientais da bacia hidrográfica do Ribeirão João Leite, considerando o uso e ocupação do solo, e as condições do reservatório de água por meio da análise de comunidades de fitoplanctôns, ensaios ecotoxicológicos e de parâmetros físico-químicos em duas épocas do ano (estiagem e chuva)..","situacao":"Em andamento","natureza":"Pesquisa","alunos":"Graduação: (4) / Especialização: (1) / Mestrado acadêmico: (13)","integrantes":"Nilson Clementino Ferreira - Coordenador / SIMONE COSTA PFEIFER - Integrante / KARLA EMMANUELA RIBEIRO hora - Integrante / NORA KÁTIA SAAVEDRA DEL AGUILA - Integrante / ALEXANDRE KEPLER SOARES - Integrante / KÁTIA ALCIONE KOPP - Integrante / AQUILA SILVA LEVINDO - Integrante / RAISSA DE LIMA COSTA - Integrante / MARCOS ALVES DE CARVALHO - Integrante / ALCIDES JUNIO LEMES MARQUES - Integrante / DIÓGENES AIRES DE MELO - Integrante / VICTOR TOMAZ DE OLIVEIRA - Integrante / LIDIANE JORGE MICHELINI - Integrante / ANA CLAUDIA MAIONE CAMPOS - Integrante / NATÁLIA CRISTINA LINO - Integrante / WILMA GOMES DA SILVA CARMO - Integrante / RAFAELA WOLFF PINA - Integrante / HUGO CESAR PEIXOTO ALVES - Integrante / MARIO ROSA DOS SANTOS - Integrante / EMMANUEL BEZERRA D ALESSANDRO - Integrante / PATRÍCIA CALDEIRA DE SOUZA - Integrante / ANSELMO CLAUDINO DE SOUSA - Integrante / WELLINGTON NUNES DE OLIVEIRA - Integrante","fin":"Fundação de Amparo a Pesquisa do Estado de Goiás - Auxílio financeiro","tipo":"Pesquisa"},{"ini":2010,"fim":2012,"titulo":"Avaliação de Imapctos Ambientais da Expansão Urbana da Região Metropolitana de Goiânia","desc":"Muitos municípios brasileiros apresentam padrão descontínuo de expansão da mancha urbana, isto é, padrão periférico de crescimento, que causam baixa densidade de ocupação do solo urbano, aumento das distâncias, ineficiência dos transportes, elevação dos custos sociais e privados da urbanização e comprometimento irreversível da eficiência da administração pública (Bolaffi, 1982) O município de Goiânia entre os anos de 1975 e 2002 teve sua área urbana praticamente duplicada, sendo que os setores norte e oeste da área urbana foram as que apresentaram maiores expansões. Em particular, a região sul do município foi a que apresentou menor expansão, pois já atingiu o limite do município de Aparecida de Goiânia (Silva et al., 2005). A expansão urbana desordenada tem causado inúmeros impactos socioambientais, tais como contaminação do solo, dos recursos hídricos e dos recursos atmosféricos, além de impactos nas infraestruturas das cidades, tais como redes educacionais, segurança pública, transporte, energia, saneamento básico, entre outras. Os objetivos desta pesquisa são: Mapeamento multitemporal e temático da expansão urbana da região metropolitana de Goiânia a partir da década de 1970 até 2010, a partir de imagens obtidas por satélites de sensoriamento remoto; - Análise geográfica dos impactos ambientais causados pela expansão urbana na região metropolitana de Goiânia entre a década de 1970 até 2010; - Modelagem da dinâmica da paisagem para elaboração da simulação da expansão urbana na região metropolitana de Goiânia até a década de 2050; - Análise dos impactos socioambientais da expansão urbana na região metropolitada de Goiânia até 2060 e - Elaboração e submissão de dois artigos científicos para publicação em periódicos indexados, sobre os resultados obtidos nesta pesquisa..","situacao":"Em andamento","natureza":"Pesquisa","alunos":"Graduação: (3) / Mestrado acadêmico: (6)","integrantes":"Nilson Clementino Ferreira - Coordenador / Nilton Ricetti Xavier de Nazareno - Integrante / Fábio Campos Macedo - Integrante / Marcos Vinícius Alexandre da Silva - Integrante / KARLA EMMANUELA RIBEIRO hora - Integrante / AQUILA SILVA LEVINDO - Integrante / MARCOS ALVES DE CARVALHO - Integrante / VICTOR TOMAZ DE OLIVEIRA - Integrante / ANA CLAUDIA MAIONE CAMPOS - Integrante / NATÁLIA CRISTINA LINO - Integrante / WELLINGTON NUNES DE OLIVEIRA - Integrante / PAULO SÉRGIO SCALIZE - Integrante / LORENA ACELINA SOARES - Integrante / JOAO GUILHERME RASSI ALMEIDA - Integrante","fin":"Fundação de Amparo a Pesquisa do Estado de Goiás - Auxílio financeiro","tipo":"Pesquisa"},{"ini":2010,"fim":null,"titulo":"Geoprocessamento Aplicado na Análise da Qualidade Ambiental","desc":"O termo Geoprocessamento denota a disciplina do conhecimento que utiliza técnicas matemáticas e computacionais para o tratamento da informação geográfica. O Geoprocessamento influencia de maneira crescente as áreas de Cartografia, Análise de Recursos Naturais, Transportes, Comunicações, Energia e Planejamento Urbano e Regional. As ferramentas computacionais para Geoprocessamento, chamadas de Sistemas de Informação Geográfica (SIG), permitem realizar análises complexas, ao integrar dados de diversas fontes e ao criar bancos de dados georreferenciados. Tornam ainda possível automatizar a produção de informações geográficas na forma de documentos cartográficos e produtos estatísticos. Num país de dimensões continentais como o Brasil, que necessita se desenvolver de maneira sustentável demanda informações adequadas para a tomada de decisões sobre os problemas urbanos, rurais e ambientais. Desta forma, o Geoprocessamento integra várias disciplinas que tornam viável a qualificação do espaço geográfico em termos ambientais, considerando aspectos físicos, tais como relevo, vegetação, solos, geologia, geomorfologia, além dos aspectos sociais, econômicos e institucionais que interferem positiva e negativamente nos recursos naturais..","situacao":"Em andamento","natureza":"Pesquisa","alunos":"Graduação: (2) / Mestrado acadêmico: (2)","integrantes":"Nilson Clementino Ferreira - Coordenador / Marcos Vinícius Alexandre da Silva - Integrante / AQUILA SILVA LEVINDO - Integrante / ANA CLAUDIA MAIONE CAMPOS - Integrante / NATÁLIA CRISTINA LINO - Integrante / CASSIO HENRIQUE GIUSTI CEZARE - Integrante / WELLINGTON NUNES DE OLIVEIRA - Integrante","fin":"Fundação de Amparo a Pesquisa do Estado de Goiás - Auxílio financeiro","tipo":"Pesquisa"},{"ini":2009,"fim":2011,"titulo":"Mapeamento e Caracterização Biofísica de Áreas de Pastagens Cultivadas no Bioma Cerrado","desc":"ssumindo a produtividade primária como um proxy para a identificação e mapeamento de áreas degradas, bem como o fato de que a mesma pode ser estimada através de dados orbitais, o projeto de pesquisa ora proposto (Edital Universal 471198/2009-9) centra-se em dois objetivos principais: a) atualização da área ocupada com pastagens cultivadas no bioma Cerrado e b) obtenção de mapas de biomassa e produtividade primária para a totalidade das áreas ocupadas com pastagens cultivadas. Por sua vez, temos a expectativa de que, a partir do entendimento dos padrões de distribuição e contexto espacial das respectivas classes e domínios biofísicos (i.e. biomassa e produtividade), será possível identificar áreas prioritárias para restauração de paisagens naturais, intensificação da pecuária ou expansão sucroalcooleira, a qual tem no bioma Cerrado as suas principais áreas alvos..","situacao":"Em andamento","natureza":"Pesquisa","alunos":"Graduação: (3) / Mestrado acadêmico: (3) / Doutorado: (1)","integrantes":"Nilson Clementino Ferreira - Integrante / Laerte Guimarães Ferreira - Coordenador / Manuel Eduardo Ferreira - Integrante / Edson Eyji Sano - Integrante / Nicali Bleyer Ferreira dos Santos - Integrante / Heleno Bezerra - Integrante / Fernando Moreira Araújo - Integrante / Fanuel Nogueira Garcia - Integrante / Maria Socorro Duarte da Silva Couto - Integrante / Nilson Cardoso Amaral - Integrante / Giltair Moreira dos Santos - Integrante","fin":"Conselho Nacional de Desenvolvimento Científico e Tecnológico - Auxílio financeiro","tipo":"Pesquisa"},{"ini":2009,"fim":2011,"titulo":"Monitoramento Sistemático dos Desmatamentos no Bioma Cerrado","desc":"Objeto de parceria entre o LAPIG, a Conservação Internacional (CI) e a The Nature Conservancy (TNC), o qual tem por objetivo o mapeamento anual (bem como a análise de padrões e tendências espaciais e temporais) de desmatamentos no bioma Cerrado, no período de 2002 a 2010..","situacao":"Em andamento","natureza":"Pesquisa","alunos":"","integrantes":"Nilson Clementino Ferreira - Integrante / Laerte Guimarães Ferreira - Coordenador / Manuel Eduardo Ferreira - Integrante / Genival Fernandes - Integrante / Mário Barroso - Integrante / Ricardo Bonfim Machado - Integrante / Leandro Baumgarten - Integrante","fin":"Conservação Internacional - Cooperação - Auxílio financeiro","tipo":"Pesquisa"},{"ini":2005,"fim":null,"titulo":"Integração de Informações Espaciais para o Planejamento e Gestão Estratégica do Cerrado - Projeto IPÊ","de     const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';

    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  };

  /* ---------- tabela ordenável com busca e paginação ---------- */
  APP.table = function (host, opt) {
    const st = { sort: opt.sort || null, dir: opt.dir || 1, page: 0, size: opt.size || 20, q: '', pre: opt.pre || (() => true) };
    host.innerHTML = `<div class="toolbar" style="padding-top:0"><div class="search"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg><input type="search" placeholder="${esc(opt.placeholder || 'Buscar na tabela')}" aria-label="Buscar"></div><span class="muted cnt" aria-live="polite"></span><button class="btn csv" style="margin-left:auto">Exportar CSV</button></div><div class="tscroll"><table class="dtable"><thead></thead><tbody></tbody></table></div><div class="pager"></div>`;
    const inp = $('input', host), thead = $('thead', host), tbody = $('tbody', host), pager = $('.pager', host), cnt = $('.cnt', host);
    const cols = opt.cols;
    const rows = () => {
      let r = opt.rows().filter(st.pre);
      if (st.q) { const t = norm(st.q).split(/\s+/).filter(Boolean); r = r.filter(x => { const h = x.q || norm(cols.map(c => (c.text ? c.text(x) : x[c.k])).join(' ')); return t.every(w => h.includes(w)); }); }
      if (st.sort != null) { const c = cols[st.sort]; const g = c.val || (x => x[c.k]); r = [...r].sort((a, b) => { const A = g(a), B = g(b); if (A == null && B == null) return 0; if (A == null) return 1; if (B == null) return -1; return (typeof A === 'number' ? A - B : String(A).localeCompare(String(B), 'pt-BR')) * st.dir; }); }
      return r;
    };
    function draw() {
      const r = rows(), pages = Math.max(1, Math.ceil(r.length / st.size)); st.page = Math.min(st.page, pages - 1);
      thead.innerHTML = '<tr>' + cols.map((c, i) => `<th class="${c.num ? 'num' : ''}" aria-sort="${st.sort === i ? (st.dir > 0 ? 'ascending' : 'descending') : 'none'}"><button data-i="${i}">${esc(c.label)}<span aria-hidden="true">${st.sort === i ? (st.dir > 0 ? '▲' : '▼') : ''}</span></button></th>`).join('') + '</tr>';
      const sl = r.slice(st.page * st.size, (st.page + 1) * st.size);
      tbody.innerHTML = sl.length ? sl.map(x => '<tr>' + cols.map(c => `<td class="${c.num ? 'num' : ''}">${c.render ? c.render(x) : esc(x[c.k] == null ? '' : x[c.k])}</td>`).join('') + '</tr>').join('') : `<tr><td colspan="${cols.length}" class="muted" style="padding:28px;text-align:center">Nenhum registro com esses filtros.</td></tr>`;
      cnt.textContent = fmt(r.length) + (r.length === 1 ? ' registro' : ' registros');
      pager.innerHTML = r.length > st.size ? `<span>Página ${st.page + 1} de ${pages}</span><span class="btns"><button data-p="-1" ${st.page === 0 ? 'disabled' : ''}>Anterior</button><button data-p="1" ${st.page >= pages - 1 ? 'disabled' : ''}>Próxima</button></span>` : '';
      draw.rows = r;
    }
    thead.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const i = +b.dataset.i; if (st.sort === i) st.dir *= -1; else { st.sort = i; st.dir = cols[i].num ? -1 : 1; } st.page = 0; draw(); });
    pager.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; st.page += +b.dataset.p; draw(); host.scrollIntoView({ block: 'nearest' }); });
    let tm; inp.addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(() => { st.q = inp.value; st.page = 0; draw(); }, 120); });
    $('.csv', host).addEventListener('click', () => { const r = rows(); APP.csv(opt.csv || 'tabela.csv', cols.map(c => c.label), r.map(x => cols.map(c => c.text ? c.text(x) : (x[c.k] == null ? '' : x[c.k])))); });
    draw.refresh = (pre) => { if (pre) st.pre = pre; st.page = 0; draw(); };
    draw(); return draw;
  };

  /* ---------- roteamento por abas ---------- */
  const VIEWS = ['visao', 'producao', 'orientacoes', 'trajetoria', 'projetos', 'mapa'];
  APP.view = 'visao';
  APP.redraws = [];
  APP.reg = fn => { APP.redraws.push(fn); fn(); return fn; };
  APP.redrawAll = () => APP.redraws.forEach(f => { try { f(); } catch (e) { console.error(e); } });
  APP.show = function (v, force) {
    if (!VIEWS.includes(v)) v = 'visao';
    APP.view = v;
    $$('.view').forEach(s => s.hidden = s.id !== 'v-' + v);
    $$('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.view === v));
    if (!APP.rendered[v] || force) { try { APP.views[v] && APP.views[v](); APP.rendered[v] = true; } catch (e) { console.error(e); $('#v-' + v).insertAdjacentHTML('afterbegin', '<p class="muted">Erro ao desenhar esta seção: ' + esc(e.message) + '</p>'); } }
    else if (APP.onView[v]) APP.onView[v]();
    if (!force) scrollTo({ top: 0 });
  };
  $('.tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; location.hash = b.dataset.view; });
  addEventListener('hashchange', () => APP.show(location.hash.slice(1)));
  let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => APP.redrawAll(), 200); });
  APP.start = () => { APP.ready = true; APP.show(location.hash.slice(1), true); };
})();

</script>
<script>
/* Gráficos SVG feitos à mão (com escalas do D3) */
(function () {
  'use strict';
  const { $, esc, fmt, col } = APP;
  const NS = 'http://www.w3.org/2000/svg';
  const svgEl = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const width = host => Math.max(280, host.clientWidth || 640);

  /* colunas empilhadas por ano */
  APP.stackedColumns = function (host, o) {
    // o: {years:[...], series:[{name,color,values[]}], height, yLabel, desc}
    host.innerHTML = '';
    if (o.legend !== false) { const lg = document.createElement('ul'); lg.className = 'legend'; lg.innerHTML = o.series.map(s => `<li><i style="background:${col(s.color)}"></i>${esc(s.name)}</li>`).join(''); host.appendChild(lg); }
    const W = width(host), H = o.height || 260, m = { t: 8, r: 6, b: 26, l: 34 };
    const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': o.desc || 'Gráfico de colunas empilhadas' }); host.appendChild(svg);
    const yrs = o.years, tot = yrs.map((_, i) => o.series.reduce((s, x) => s + x.values[i], 0));
    const x = d3.scaleBand().domain(yrs).range([m.l, W - m.r]).paddingInner(.18).paddingOuter(.05);
    const y = d3.scaleLinear().domain([0, Math.max(1, d3.max(tot))]).nice().range([H - m.b, m.t]);
    const g = svgEl('g', { class: 'axis' }, svg);
    y.ticks(5).forEach(t => { svgEl('line', { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), class: 'gridline' }, g); const tx = svgEl('text', { x: m.l - 6, y: y(t) + 4, 'text-anchor': 'end' }, g); tx.textContent = t; });
    const step = Math.ceil(yrs.length / Math.max(2, Math.floor((W - m.l) / 42)));
    yrs.forEach((yr, i) => { if (i % step === 0 || i === yrs.length - 1) { const tx = svgEl('text', { x: x(yr) + x.bandwidth() / 2, y: H - 8, 'text-anchor': 'middle' }, g); tx.textContent = yr; } });
    yrs.forEach((yr, i) => {
      let acc = 0;
      o.series.forEach(s => { const v = s.values[i]; if (!v) return; const y0 = y(acc), y1 = y(acc + v); acc += v; svgEl('rect', { x: x(yr), width: x.bandwidth(), y: y1, height: Math.max(0, y0 - y1 - 1.5), rx: 2, fill: col(s.color) }, svg); });
      const hit = svgEl('rect', { x: x(yr) - 2, width: x.bandwidth() + 4, y: m.t, height: H - m.t - m.b, class: 'hit' }, svg);
      APP.bindTip(hit, () => `<b>${yr}</b>` + o.series.filter(s => s.values[i]).map(s => `<div class="r"><span><i class="dot" style="background:${col(s.color)}"></i>${esc(s.name)}</span><b>${s.values[i]}</b></div>`).join('') + (o.series.length > 1 ? `<div class="r" style="border-top:1px solid var(--line);margin-top:3px;padding-top:3px"><span>Total</span><b>${tot[i]}</b></div>` : ''));
    });
  };

  /* barras horizontais */
  APP.hbars = function (host, data, o = {}) {
    // data: [{label, value, color?, tip?}]
    host.innerHTML = '';
    const rowH = o.rowH || 26, W = width(host), lw = Math.min(o.labelW || 190, W * .5), m = { t: 4, r: 40, b: 4, l: lw };
    const H = m.t + m.b + rowH * data.length;
    const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': o.desc || 'Gráfico de barras' }); host.appendChild(svg);
    const x = d3.scaleLinear().domain([0, Math.max(1, d3.max(data, d => d.value))]).range([0, W - m.l - m.r]);
    const cut = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
    const maxCh = Math.floor(lw / 6.4);
    data.forEach((d, i) => {
      const yy = m.t + i * rowH, gg = svgEl('g', { class: 'bar-row' }, svg);
      const t = svgEl('text', { x: m.l - 8, y: yy + rowH / 2 + 4, 'text-anchor': 'end', class: 'bar-label' }, gg); t.textContent = cut(d.label, maxCh);
      svgEl('rect', { x: m.l, y: yy + 4, width: Math.max(2, x(d.value)), height: rowH - 9, rx: 3, fill: col(d.color || o.color || 'g1') }, gg);
      const v = svgEl('text', { x: m.l + Math.max(2, x(d.value)) + 6, y: yy + rowH / 2 + 4, class: 'bar-val' }, gg); v.textContent = fmt(d.value);
      const hit = svgEl('rect', { x: 0, y: yy, width: W, height: rowH, class: 'hit' }, gg);
      APP.bindTip(hit, () => d.tip || `<b>${esc(d.label)}</b><div class="r"><span>${esc(o.unit || 'Itens')}</span><b>${fmt(d.value)}</b></div>`);
      if (d.onclick) { hit.style.cursor = 'pointer'; hit.addEventListener('click', d.onclick); }
    });
  };

  /* linha acumulada (área) */
  APP.cumLine = function (host, years, values, o = {}) {
    host.innerHTML = '';
    const W = width(host), H = o.height || 200, m = { t: 10, r: 10, b: 26, l: 38 };
    const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': o.desc || 'Total acumulado por ano' }); host.appendChild(svg);
    const x = d3.scaleLinear().domain([years[0], years[years.length - 1]]).range([m.l, W - m.r]);
    const y = d3.scaleLinear().domain([0, d3.max(values) || 1]).nice().range([H - m.b, m.t]);
    const g = svgEl('g', { class: 'axis' }, svg);
    y.ticks(4).forEach(t => { svgEl('line', { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), class: 'gridline' }, g); const tx = svgEl('text', { x: m.l - 6, y: y(t) + 4, 'text-anchor': 'end' }, g); tx.textContent = t; });
    x.ticks(Math.floor(W / 80)).forEach(t => { const tx = svgEl('text', { x: x(t), y: H - 8, 'text-anchor': 'middle' }, g); tx.textContent = Math.round(t); });
    const c = col(o.color || 'g1');
    const area = d3.area().x((_, i) => x(years[i])).y0(y(0)).y1(v => y(v)).curve(d3.curveStepAfter);
    svgEl('path', { d: area(values), fill: c, 'fill-opacity': .18 }, svg);
    svgEl('path', { d: d3.line().x((_, i) => x(years[i])).y(v => y(v)).curve(d3.curveStepAfter)(values), fill: 'none', stroke: c, 'stroke-width': 2 }, svg);
    const dot = svgEl('circle', { r: 4.5, fill: c, stroke: col('surface'), 'stroke-width': 2, opacity: 0 }, svg);
    const hit = svgEl('rect', { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, class: 'hit' }, svg);
    hit.addEventListener('mousemove', e => { const r = svg.getBoundingClientRect(); const px = (e.clientX - r.left) * W / r.width; const yr = Math.round(x.invert(px)); const i = Math.max(0, Math.min(years.length - 1, yr - years[0])); dot.setAttribute('cx', x(years[i])); dot.setAttribute('cy', y(values[i])); dot.setAttribute('opacity', 1); APP.tip.show(`<b>${years[i]}</b><div class="r"><span>${esc(o.unit || 'Acumulado')}</span><b>${fmt(values[i])}</b></div>`, e); });
    hit.addEventListener('mouseleave', () => { dot.setAttribute('opacity', 0); APP.tip.hide(); });
  };

  /* linha do tempo em faixas (swimlane) */
  APP.swimlane = function (host, lanes, o = {}) {
    // lanes: [{label, items:[{ini,fim,label,color,tip}]}]
    host.innerHTML = '';
    const W = Math.max(900, width(host)), rowH = 30, m = { t: 26, r: 18, b: 6, l: 190 };
    const H = m.t + m.b + lanes.length * rowH;
    const svg = svgEl('svg', { id: 'timeline', viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': o.desc || 'Linha do tempo' }); svg.style.minWidth = W + 'px'; host.appendChild(svg);
    const all = lanes.flatMap(l => l.items); const t0 = Math.floor(d3.min(all, d => d.ini) / 5) * 5, t1 = APP.CUR + 1;
    const x = d3.scaleLinear().domain([t0, t1]).range([m.l, W - m.r]);
    const g = svgEl('g', { class: 'tl-axis' }, svg);
    x.ticks(Math.floor((W - m.l) / 70)).forEach(t => { svgEl('line', { x1: x(t), x2: x(t), y1: m.t - 4, y2: H - m.b, class: 'tl-grid', opacity: .5 }, g); const tx = svgEl('text', { x: x(t), y: m.t - 10, 'text-anchor': 'middle' }, g); tx.textContent = Math.round(t); });
    lanes.forEach((l, i) => {
      const yy = m.t + i * rowH;
      if (i % 2 === 0) svgEl('rect', { x: 0, y: yy, width: W, height: rowH, fill: col('line2'), opacity: .35 }, svg);
      const t = svgEl('text', { x: m.l - 10, y: yy + rowH / 2 + 4, 'text-anchor': 'end', class: 'tl-lane-label' }, svg); t.textContent = l.label.length > 30 ? l.label.slice(0, 29) + '…' : l.label;
      l.items.forEach(it => {
        const fim = it.fim == null ? APP.CUR + 1 : Math.max(it.fim + 1, it.ini + .6);
        const r = svgEl('rect', { x: x(it.ini), y: yy + 6, width: Math.max(5, x(fim) - x(it.ini)), height: rowH - 12, rx: 4, fill: col(it.color || 'g1'), class: 'tl-bar', opacity: it.fim == null ? 1 : .88 }, svg);
        APP.bindTip(r, () => it.tip);
      });
    });
  };
})();

</script>
<script>
/* Seções do painel */
(function () {
  'use strict';
  const { D, $, $$, esc, fmt, norm, sum, pubs, bancas, ori, projs, CUR } = APP;
  const V = APP.views;
  const count = (arr, f) => { const m = new Map(); arr.forEach(x => { const k = f(x); if (k == null || k === '') return; m.set(k, (m.get(k) || 0) + 1); }); return [...m].sort((a, b) => b[1] - a[1]); };
  const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
  const sec = (id, title, take, body, extra = '') => `<section class="sec" id="${id}"><header><h2>${title}</h2>${extra}</header>${take ? `<p class="take">${take}</p>` : ''}${body}</section>`;

  const ORI_COL = { 'Doutorado': 'g7', 'Mestrado': 'g1', 'Especialização': 'g3', 'TCC de graduação': 'g4', 'Iniciação científica': 'g5' };
  const BAN_COL = { 'Dissertação de mestrado': 'g1', 'Tese de doutorado': 'g7', 'Qualificação de mestrado': 'g2', 'Qualificação de doutorado': 'g8', 'Especialização': 'g3', 'TCC de graduação': 'g4', 'Concurso público': 'g5', 'Outras participações': 'gr' };
  ori.forEach(o => { o.nivel = ORI_LABEL[o.tipo] || o.tipo; });

  const instName = k => (D.geo.inst[k] || {}).nome || '—';
  APP.instName = instName;

  /* ================= VISÃO GERAL ================= */
  V.visao = function () {

      { name: 'Artigos em periódicos', color: 'g1', values: grp('Artigos') },

      { name: 'Produção técnica', color: 'g7', values: grp('Técnica') },
      { name: 'Outras', color: 'gr', values: grp(['Livros', 'Textos', 'Apresentações', 'Outras']) }

          <div class="id-row"><span>Servidor UFG</span><b>desde ${vincUFG ? vincUFG.ini : 2010} · dedicação exclusiva</b></div>
          <div class="cite-row">
            <div class="cite"><b>${fmt(D.citacoes.scholar.citacoes)}</b><span>citações no Google Scholar<br>${D.citacoes.scholar.trabalhos} trabalhos · ${D.citacoes.scholar.data}</span></div>
            <div class="cite"><b>${fmt(D.citacoes.wos.citacoes)}</b><span>citações na Web of Science<br>${D.citacoes.wos.trabalhos} trabalhos · ${D.citacoes.wos.data}</span></div>
          </div>
        </aside>
      </div>
      <dl class="kpis">
        <div><dt>Artigos em periódicos</dt><dd>${art}</dd></div>
        <div><dt>Capítulos de livros</dt><dd>${cap}<small>${cap - nSerie} avulsos + ${nSerie} da série “Diagnóstico técnico participativo” (2020)</small></dd></div>
        <div><dt>Trabalhos em eventos</dt><dd>${evt}</dd></div>

        <div><dt>Orientações concluídas</dt><dd>${oriDone.length}<small>${oriNow.length} em andamento</small></dd></div>
        <div><dt>Participações em bancas</dt><dd>${bancas.length}</dd></div>
        <div><dt>Projetos</dt><dd>${projs.length}</dd></div>
        <div><dt>Coautores distintos</dt><dd>${D.n_coautores}</dd></div>
      </dl>
      ${sec('s-ano', 'Produção por ano', `De ${y0} a ${y1}, ${own.length} registros com data. O pico foi em ${(() => { const t = yrs.map((_, i) => sum(series, s => s.values[i])); const m = Math.max(...t); return yrs[t.indexOf(m)] + ' (' + m + ' itens)'; })()}. Em 2020 há ${nSerie} capítulos da série “Diagnóstico técnico participativo” (30 comunidades, 2 capítulos cada), mostrados em cor própria.`, '<div class="chart-area" id="c-ano"></div>')}
      <div class="two">
        ${sec('s-acum', 'Artigos acumulados', 'Soma de artigos publicados em periódicos ao longo do tempo.', '<div class="chart-area" id="c-acum"></div>')}
        ${sec('s-rh', 'Formação de recursos humanos', 'Orientações concluídas e participações em bancas por ano.', '<div class="chart-area" id="c-rh"></div>')}
      </div>
      <div class="two">
        ${sec('s-top', 'Onde publica', 'Periódicos com mais artigos.', '<div class="chart-area" id="c-per"></div>')}

      </div>`;
    APP.reg(() => {
      APP.stackedColumns($('#c-ano'), { years: yrs, series, height: 280, desc: 'Produção por ano e tipo' });
      const ay = range(y0, y1); let acc = 0; const av = ay.map(y => (acc += D.artigos.filter(a => a.ano === y).length));

<script>
/* Mapa interativo próprio, sobre ladrilhos de mapas livres (OpenStreetMap e derivados), sem biblioteca externa */

    topo: { nome: 'Relevo (OpenTopoMap)', url: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', sub: 'abc', bg: '#e4e2d6', maxz: 17, attr: OSMA.replace('Colaboradores do ', '') + ' · © <a href="https://opentopomap.org" target="_blank" rel="noopener">OpenTopoMap</a> (CC-BY-SA)' },

      if (!pts.length) return;

      closePop(); const a = +y0.value, b = +y1.value; $('#yr-lab').textContent = a + ' a ' + b;
      pts = buildPoints(a, b, on); drawOverlay();
      LAYERS.forEach(l => { const e = $(`[data-n="${l.id}"]`); if (e) e.textContent = pts.filter(p => p.layer === l.id).length; });
      const pl = [...pts].sort((x, y) => y.n - x.n);
      $('#pl-n').textContent = '(' + pl.length + ')';
      $('#plist').innerHTML = pl.map((p, i) => `<button data-i="${i}"><i class="dot" style="background:${colorOf(p.layer)};margin:0"></i><span>${esc(p.nome)}</span><span class="n">${p.n}</span></button>`).join('') || '<span class="muted">Nenhum ponto neste período.</span>';
      $('#plist').onclick = e => { const bt = e.target.closest('button'); if (!bt) return; const p = pl[+bt.dataset.i]; map.setView(p.lat, p.lon, Math.max(map.z, 7)); setTimeout(() => openPop(p), 30); };
      if (fit) map.fit(pts);
    };
    map.onfit = () => map.fit(pts);
    $('#layers').addEventListener('change', e => { const i = e.target.closest('input'); if (!i) return; on[i.dataset.l] = i.checked; refresh(false); });
    y0.addEventListener('input', () => { if (+y0.value > +y1.value) y1.value = y0.value; refresh(false); });
    y1.addEventListener('input', () => { if (+y1.value < +y0.value) y0.value = y1.value; refresh(false); });
    const base = $('#base'); base.value = defBase(); map.onfallback = k => { base.value = k; map.errors = 0; map.setProvider(k); };
    base.addEventListener('change', () => map.setProvider(base.value));
    map.setProvider(base.value);
    map.setView(-15.8, -50, 4);
    refresh(false);
    APP.map = map;
    APP.reg(() => { if (APP.mapAutoBase && ['dark', 'light', 'streets', 'osm'].includes(base.value) && base.value !== defBase()) { base.value = defBase(); map.setProvider(base.value); } drawOverlay(); });
    APP.mapAutoBase = true;
  };
  APP.onView.mapa = () => { APP.map && APP.map.render(); };
})();

</script>
<script>
(function(){try{APP.start()}catch(e){console.error(e);document.getElementById('main').insertAdjacentHTML('afterbegin','<p style="padding:24px">Erro ao iniciar: '+e.message+'</p>')}})();

</script>
</body>
</html>
